# Alembic config for the database migrations (T-012).
# The database URL is not stored here: backend/migrations/env.py reads it from the app's settings (.env),
# unless a caller sets sqlalchemy.url on the Config (the T-012 check does that for a throwaway SQLite file).
#   .venv\Scripts\python.exe -m alembic upgrade head
[alembic]
script_location = backend/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
